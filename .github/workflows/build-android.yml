name: Build Android (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [m1-support, m1-support-android]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Android NDK
        run: |
          NDK_VER="r27c"
          curl -sLO "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q android-ndk-${NDK_VER}-linux.zip
          echo "NDK=$PWD/android-ndk-${NDK_VER}" >> $GITHUB_ENV
          echo "$PWD/android-ndk-${NDK_VER}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3-pip
          pip3 install meson

      - name: Build dependencies
        run: |
          set -e
          TARGET=aarch64-linux-android21

          # Cross file for meson
          cat > /tmp/cross.txt << 'MESON'
          [binaries]
          c = 'aarch64-linux-android21-clang'
          cpp = 'aarch64-linux-android21-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          MESON

          # glib
          GLIB_VER=2.80.4
          curl -sLO "https://download.gnome.org/sources/glib/2.80/glib-${GLIB_VER}.tar.xz"
          tar xf glib-${GLIB_VER}.tar.xz
          cd glib-${GLIB_VER}
          meson setup _build --cross-file /tmp/cross.txt --prefix=$PWD/_install \
            --default-library=static -Dlibelf=disabled -Dselinux=disabled \
            -Dxattr=false -Dlibmount=disabled -Dnls=disabled -Dtests=false \
            -Dglib_assert=false -Dglib_checks=false
          ninja -C _build -j$(nproc) && ninja -C _build install
          echo "GLIB_PREFIX=$PWD/_install" >> $GITHUB_ENV
          cd ..

          # pixman
          PIXMAN_VER=0.44.2
          curl -sLO "https://www.cairographics.org/releases/pixman-${PIXMAN_VER}.tar.gz"
          tar xf pixman-${PIXMAN_VER}.tar.gz
          cd pixman-${PIXMAN_VER}
          meson setup _build --cross-file /tmp/cross.txt --prefix=$PWD/_install \
            --default-library=static -Dtests=disabled -Ddemos=disabled
          ninja -C _build -j$(nproc) && ninja -C _build install
          echo "PIXMAN_PREFIX=$PWD/_install" >> $GITHUB_ENV
          cd ..

      - name: Configure and Build QEMU
        env:
          PKG_CONFIG_PATH: ""
        run: |
          # QEMU needs to find glib and pixman via pkg-config
          export PKG_CONFIG_PATH="${GLIB_PREFIX}/lib/pkgconfig:${PIXMAN_PREFIX}/lib/pkgconfig"
          export CFLAGS="-I${GLIB_PREFIX}/include -I${PIXMAN_PREFIX}/include"
          export LDFLAGS="-L${GLIB_PREFIX}/lib -L${PIXMAN_PREFIX}/lib"

          mkdir -p build && cd build
          ../configure \
            --cross-prefix=aarch64-linux-android21- \
            --target-list=aarch64-softmmu \
            --disable-tools \
            --disable-system \
            --disable-user \
            --disable-guest-agent \
            --disable-docs \
            --disable-werror \
            --enable-fdt=internal \
            --disable-sdl \
            --disable-gtk \
            --disable-curses \
            --disable-vnc \
            --enable-slirp=disabled \
            --static \
            --extra-cflags="-I${GLIB_PREFIX}/include/glib-2.0 -I${GLIB_PREFIX}/lib/glib-2.0/include -I${PIXMAN_PREFIX}/include" \
            --extra-ldflags="-L${GLIB_PREFIX}/lib -L${PIXMAN_PREFIX}/lib"

          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p artifact
          cp build/qemu-system-aarch64 artifact/
          file artifact/qemu-system-aarch64
          ls -lh artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-m1-android-arm64
          path: artifact/
