name: Build Inferno M1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15  # ARM64 runner, fast
    env:
      CFLAGS: -arch x86_64
      LDFLAGS: -arch x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ninja pkg-config glib pixman

      - name: Configure (cross-compile to x86_64)
        run: |
          mkdir build && cd build
          ../configure --target-list=aarch64-softmmu --cpu=x86_64 2>&1 | tail -20

      - name: Compile
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu) 2>&1 | tail -50
          ls -lh qemu-system-aarch64
          file qemu-system-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-m1-x86_64
          path: build/qemu-system-aarch64
