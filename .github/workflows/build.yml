name: Build Inferno M1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup x86_64 Homebrew
        run: |
          if [ ! -f /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" \
              < /dev/null
          fi

      - name: Install x86_64 deps
        run: |
          # Remove stale symlinks that conflict with brew's python linking
          rm -f /usr/local/bin/python3 /usr/local/bin/python3.14 \
                /usr/local/bin/pip3 /usr/local/bin/pip3.14 \
                /usr/local/bin/pydoc3 /usr/local/bin/pydoc3.14 \
                /usr/local/bin/idle3 /usr/local/bin/idle3.14 \
                /usr/local/bin/python3-config /usr/local/bin/python3.14-config
          /usr/local/bin/brew install ninja pkg-config glib pixman meson libtasn1

      - name: Configure
        run: |
          export PATH="/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig"
          mkdir -p build && cd build
          arch -x86_64 ../configure --target-list=aarch64-softmmu

      - name: Build
        run: |
          export PATH="/usr/local/bin:$PATH"
          arch -x86_64 make -C build -j$(sysctl -n hw.ncpu)

      - name: Verify
        run: ls -lh build/qemu-system-aarch64 && file build/qemu-system-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-m1-x86_64
          path: build/qemu-system-aarch64
