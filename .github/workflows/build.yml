name: Build Inferno M1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja pkg-config glib pixman
      - run: mkdir build && cd build && ../configure --target-list=aarch64-softmmu 2>&1 | tail -15
      - run: cd build && make -j$(sysctl -n hw.ncpu) 2>&1 | tail -30
      - run: ls -lh build/qemu-system-aarch64 && file build/qemu-system-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-m1-x86_64
          path: build/qemu-system-aarch64
