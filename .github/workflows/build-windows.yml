name: Build Inferno M1 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-libtasn1
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-nettle
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-snappy
            mingw-w64-x86_64-ncurses
            python
            git

      - name: Build lzfse stub
        run: |
          # lzfse is Apple-only; create a stub for Windows
          cat > /tmp/lzfse.h << 'EOF'
          #ifndef LZFSE_H
          #define LZFSE_H
          #include <stddef.h>
          #include <stdint.h>
          #define LZFSE_ENCODE_LZVN (1)
          #define LZFSE_ENCODE_LZFSE (2)
          size_t lzfse_encode_scratch_size(void);
          size_t lzfse_decode_scratch_size(void);
          size_t lzfse_encode_buffer(uint8_t *__restrict dst, size_t dst_size,
              const uint8_t *__restrict src, size_t src_size, void *__restrict scratch);
          size_t lzfse_decode_buffer(uint8_t *__restrict dst, size_t dst_size,
              const uint8_t *__restrict src, size_t src_size, void *__restrict scratch);
          #endif
          EOF
          cp /tmp/lzfse.h /mingw64/include/lzfse.h
          # Create stub .a with empty symbol
          echo 'void __lzfse_stub(void){}' | gcc -c -x c - -o /tmp/lzfse_stub.o
          ar rcs /mingw64/lib/liblzfse.a /tmp/lzfse_stub.o

      - name: Configure
        run: |
          mkdir -p build && cd build
          ../configure --target-list=aarch64-softmmu --disable-werror \
            --disable-guest-agent \
            --extra-cflags="-I/mingw64/include" \
            --extra-ldflags="-L/mingw64/lib -llzfse"

      - name: Build
        run: |
          export PATH="/mingw64/bin:$PATH"
          ninja -C build

      - name: Verify
        run: ls -lh build/qemu-system-aarch64.exe && file build/qemu-system-aarch64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-m1-windows-x86_64
          path: build/qemu-system-aarch64.exe
